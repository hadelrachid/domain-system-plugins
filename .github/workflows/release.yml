name: Build and Release Stable Plugins

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, json

      - name: Build Stable Plugin ZIPs and Update marketplace.json
        run: php tools/build-plugins.php

      - name: Commit and Push marketplace.json to main
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git add marketplace.json
          git diff-index --quiet HEAD || (git commit -m "chore(marketplace): sync sha256 hashes generated by CI build [skip ci]" && git push origin main)

      - name: Publish Stable Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
            marketplace.json
          generate_release_notes: true
